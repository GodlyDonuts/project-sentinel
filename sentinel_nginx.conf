server {
    server_name api.sentinelguard.dev;

    # SSL Configuration (Restored)
    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/api.sentinelguard.dev/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/api.sentinelguard.dev/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 1-Hour Timeout for WebSockets
        proxy_read_timeout 3600;
    }
}

# HTTP Redirect to HTTPS
server {
    if ($host = api.sentinelguard.dev) {
        return 301 https://$host$request_uri;
    } 

    server_name api.sentinelguard.dev;
    listen 80;
    return 404; 
}
